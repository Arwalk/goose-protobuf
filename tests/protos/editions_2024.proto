// Golden and round-trip: what edition 2024 adds, which is new syntax (export, local,
// import option) and stricter names, with the wire behaviour of edition 2023.
edition = "2024";

package ed24;

import "editions_2024_dep.proto";
import option "editions_2024_options.proto";

export enum Color {
  COLOR_UNSPECIFIED = 0;
  COLOR_RED = 1;
}

local enum Closed {
  option features.enum_type = CLOSED;

  CLOSED_ONE = 1;
}

local message Hidden {
  int32 v = 1;
}

export message Book {
  option (ed24opts.shelf) = 7;

  // Top-level visibility is the default, and a nested type is local unless exported.
  export message Nested {
    int32 n = 1;
  }

  message Inner {
    int32 i = 1;
  }

  string title = 1;
  int32 explicit_field = 2;
  int32 implicit_field = 3 [features.field_presence = IMPLICIT];
  Color color = 4;
  Closed closed = 5;
  repeated int32 packed_values = 6;
  repeated int32 expanded_values = 7 [features.repeated_field_encoding = EXPANDED];
  map<string, int32> counts = 8;
  ed24dep.Shared shared = 9;
  Hidden hidden = 10;
  Nested nested = 11;
  Inner inner = 12;
  Inner delimited_inner = 13 [features.message_encoding = DELIMITED];
  string unchecked = 14 [features.utf8_validation = NONE];

  oneof choice {
    int32 number = 15;
    string word = 16;
  }
}

// A name that STYLE2024 would refuse, where a file or element opts out.
message legacy_name {
  option features.enforce_naming_style = STYLE_LEGACY;

  int32 Odd_Name = 1;
}
