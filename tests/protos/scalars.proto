// Golden and round-trip (tests/roundtrip/scalars/): every numeric and bool
// scalar type and an enum, with implicit presence. Fields are declared out
// of number order: encode follows field numbers, as protoc does. Fields of
// kinds not stored yet (string) are skipped on decode.
syntax = "proto3";

package scalars;

enum Color {
  COLOR_UNSPECIFIED = 0;
  COLOR_RED = 1;
  COLOR_NEGATIVE = -1;
}

message Scalars {
  int32 f_int32 = 1;
  int64 f_int64 = 2;
  uint32 f_uint32 = 3;
  uint64 f_uint64 = 4;
  sint32 f_sint32 = 5;
  sint64 f_sint64 = 6;
  fixed32 f_fixed32 = 7;
  fixed64 f_fixed64 = 8;
  sfixed32 f_sfixed32 = 9;
  sfixed64 f_sfixed64 = 10;
  float f_float = 11;
  double f_double = 12;
  bool f_bool = 13;
  Color f_color = 14;
  // High field numbers: multi-byte tags.
  int32 f_big = 536870911;
  int32 f_mid = 16;
  // Not stored yet.
  string f_string = 20;
  // Stored, with a has-bit (tests/protos/optional.proto).
  optional int32 f_optional = 21;

  message Inner {
    sint64 type = 1;
  }
}
