// Golden: nested messages and enums, three levels deep, in a package.
syntax = "proto3";

package goose.test.nested;

message Outer {
  message Middle {
    message Inner {}
    enum Kind {
      KIND_UNSPECIFIED = 0;
      KIND_LEAF = 1;
    }
  }
  enum State {
    STATE_UNSPECIFIED = 0;
  }
}

message Sibling {
  message Inner {}
}
