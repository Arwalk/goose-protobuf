// Golden and round-trip: repeated scalars (gpb-gp4.1). The two messages have
// the same fields, so each reads the other's encoding.
syntax = "proto3";

package repeated;

enum Color {
  COLOR_UNSPECIFIED = 0;
  COLOR_RED = 1;
}

message Packed {
  repeated int32 f_int32 = 1;
  repeated int64 f_int64 = 2;
  repeated uint32 f_uint32 = 3;
  repeated uint64 f_uint64 = 4;
  repeated sint32 f_sint32 = 5;
  repeated sint64 f_sint64 = 6;
  repeated fixed32 f_fixed32 = 7;
  repeated fixed64 f_fixed64 = 8;
  repeated sfixed32 f_sfixed32 = 9;
  repeated sfixed64 f_sfixed64 = 10;
  repeated float f_float = 11;
  repeated double f_double = 12;
  repeated bool f_bool = 13;
  repeated Color f_enum = 14;
  // A singular field among them, and a two-byte tag.
  int32 single = 15;
  repeated int32 far = 2000 [packed = true];
}

message Unpacked {
  repeated int32 f_int32 = 1 [packed = false];
  repeated int64 f_int64 = 2 [packed = false];
  repeated uint32 f_uint32 = 3 [packed = false];
  repeated uint64 f_uint64 = 4 [packed = false];
  repeated sint32 f_sint32 = 5 [packed = false];
  repeated sint64 f_sint64 = 6 [packed = false];
  repeated fixed32 f_fixed32 = 7 [packed = false];
  repeated fixed64 f_fixed64 = 8 [packed = false];
  repeated sfixed32 f_sfixed32 = 9 [packed = false];
  repeated sfixed64 f_sfixed64 = 10 [packed = false];
  repeated float f_float = 11 [packed = false];
  repeated double f_double = 12 [packed = false];
  repeated bool f_bool = 13 [packed = false];
  repeated Color f_enum = 14 [packed = false];
  int32 single = 15;
  repeated int32 far = 2000 [packed = false];
}

// A repeated field in a recursive message.
message Tree {
  repeated int32 values = 1;
  Tree next = 2;
}
