# CI: generator build and tests, golden tests and Goose unit tests on Linux
# and macOS. Every step runs a script that also runs locally (CONTRIBUTING.md).
# Pins live in TOOLCHAIN.md; the conformance job is gpb-iip.9.
name: ci

on:
  push:
  pull_request:

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # The protobuf submodule is only needed by the conformance runner.
      - uses: actions/checkout@v4

      - name: Cache pinned protoc and Goose
        uses: actions/cache@v4
        with:
          path: .tools
          key: tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/install_toolchain.sh') }}

      - name: Install pinned protoc and Goose
        run: |
          scripts/install_toolchain.sh
          echo "$PWD/.tools/bin" >> "$GITHUB_PATH"

      - name: Toolchain versions
        run: |
          protoc --version
          goose version
          goose toolchain

      - name: Generator build
        run: scripts/build_plugin.sh

      - name: Plugin smoke test
        run: tests/smoke_plugin.sh

      - name: Runtime typecheck
        run: goose check runtime/pb_wire.goose

      - name: Golden tests
        run: scripts/golden.sh

      - name: Goose unit tests
        run: scripts/goose_tests.sh

      - name: Round-trip tests
        run: scripts/roundtrip.sh

      - name: Cross-implementation round trips
        run: scripts/interop.sh

      - name: Bindings for descriptor and plugin protos
        run: scripts/selfhost_bindings.sh

      - name: Goose generator unit tests
        run: scripts/selfhost_tests.sh

      - name: Guides
        run: python3 scripts/check_docs.py

      - name: Consumer test
        run: scripts/consumer_test.sh

      - name: Harness self-tests
        run: |
          scripts/test_golden.sh
          scripts/test_goose_tests.sh
          scripts/test_roundtrip.sh
          scripts/test_interop.sh
          scripts/test_check_docs.sh
          scripts/test_consumer_test.sh
          scripts/test_check_generated.sh
          scripts/test_install_plugin.sh
          scripts/test_selfhost_tests.sh

  conformance:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # update = none in .gitmodules keeps it out of what package users fetch
      # (decision 0005), so it takes --checkout.
      - name: Check out the protobuf submodule
        run: git submodule update --init --checkout third_party/protobuf

      - name: Cache pinned protoc and Goose
        uses: actions/cache@v4
        with:
          path: .tools
          key: tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/install_toolchain.sh') }}

      - name: Install pinned protoc and Goose
        run: |
          scripts/install_toolchain.sh
          echo "$PWD/.tools/bin" >> "$GITHUB_PATH"

      # Messages the testee will use, generated and goose-checked (no golden).
      - name: Generate conformance messages
        run: |
          scripts/check_generated.sh -I third_party/protobuf/src -I third_party/protobuf \
            google/protobuf/test_messages_proto3.proto \
            google/protobuf/test_messages_proto2.proto \
            editions/golden/test_messages_proto3_editions.proto \
            editions/golden/test_messages_proto2_editions.proto \
            conformance/test_protos/test_messages_edition2023.proto

      # The committed copy in wkt/ matches the plugin (decision 0007).
      - name: Check well-known types
        run: scripts/wkt.sh

      # The plugin is built on its own output: it writes its bindings unchanged.
      - name: Plugin bindings
        run: scripts/regen_bindings.sh

      # The feature defaults that the generator tests against match protoc's.
      - name: Check edition defaults
        run: scripts/edition_defaults.sh

      - name: Protobuf submodule commit
        id: pb
        run: echo "commit=$(git rev-parse HEAD:third_party/protobuf)" >> "$GITHUB_OUTPUT"

      # The whole build dir is cached: the runner loads libjsoncpp from it.
      - name: Cache conformance runner
        id: runner-cache
        uses: actions/cache@v4
        with:
          path: build/pb
          key: runner-${{ runner.os }}-${{ runner.arch }}-${{ steps.pb.outputs.commit }}-${{ hashFiles('scripts/build_runner.sh') }}

      - name: Build conformance runner (cache miss only)
        if: steps.runner-cache.outputs.cache-hit != 'true'
        run: scripts/build_runner.sh

      - name: Check runner
        run: test -x build/pb/conformance_test_runner

      # The stdin shim (read(2)) was only run on linux-x64 by the spike
      # (docs/decisions/0003-stdio.md); this runs it on macOS too.
      - name: Stdio framing check
        run: |
          mkdir -p build
          goose build tests/spikes/stdio/echo.goose -o build/echo
          python3 tests/spikes/stdio/driver.py build/echo

      # Fails if any result does not match conformance/failure_list_goose.txt.
      - name: Conformance suite
        run: scripts/run_conformance.sh --maximum_edition 2023

      # Fails if any result does not match conformance/failure_list_recommended.txt.
      - name: Conformance suite, recommended tests too
        run: >-
          FAILURE_LIST=conformance/failure_list_recommended.txt
          scripts/run_conformance.sh build/testee --maximum_edition 2023 --enforce_recommended

      - name: Testee and harness checks
        run: |
          python3 conformance/check_testee.py build/testee
          scripts/test_run_conformance.sh
